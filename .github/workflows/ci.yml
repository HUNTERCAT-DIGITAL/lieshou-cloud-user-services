name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (mvn verify + spotless + jacoco)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with framework submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify (聚合构建 · framework submodule + services)
        run: mvn -B -ntp -DskipITs -s services/.m2-settings.xml -f pom.xml verify
